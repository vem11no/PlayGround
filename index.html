<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DUELLINKS // Sky Arena</title>
<style>
:static{}
*{box-sizing:border-box} :root{--blue:#70d0eb;--brown:#b98752;--ink:#102735;--gold:#ffd56a}
body{margin:0;background:#07121d;color:#eefbff;font-family:"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;overflow:hidden}
button,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}
#app{height:100dvh;background:radial-gradient(circle at 50% 45%,#b8edf3 0,#5abbd0 16%,#183c50 55%,#07121d 100%);position:relative}
#app:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(90deg,transparent 50%,#fff 50%),linear-gradient(transparent 50%,#fff 50%);background-size:8px 8px}
.screen{position:absolute;inset:0;z-index:2}.menu{display:flex;align-items:center;justify-content:center}.panel{width:min(580px,92vw);padding:30px;background:rgba(13,36,49,.94);border:2px solid #86d9e8;box-shadow:12px 12px 0 rgba(5,12,17,.55)}
.logo{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(44px,9vw,86px);letter-spacing:-3px;text-align:center;color:#cdeff4;text-shadow:4px 4px 0 #3a7891,8px 8px 0 #132632;margin:0 0 18px}.logo em{color:#8ee3ef;font-style:normal}.sub{text-align:center;color:#ffd998;letter-spacing:7px;font-size:12px;margin:-15px 0 28px}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px}.form label{align-self:center;color:#8dd0df}.form input{min-width:0;width:100%;padding:13px;background:#091923;border:1px solid #63b4c7;color:white;outline:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button,.wide{border:0;padding:14px;font-weight:900;color:#102733;background:var(--gold);box-shadow:4px 4px 0 #8a6338}.actions button.secondary{background:#78bfd0}.wide{width:100%;margin-top:12px}
#roomList{display:grid;gap:8px;margin:18px 0}.room{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #5791a1;background:#102c39}.room button{border:0;padding:8px 11px;background:#ffd56a;color:#1a2b30;font-weight:bold}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(7,22,30,.94);border-bottom:2px solid #70bacc}.brand{font-weight:900;color:#9cdae7}.brand b{color:#ffd56a}.topactions{display:flex;gap:8px}.topactions button{border:1px solid #79bac7;background:#173845;color:white;padding:7px 10px}
.duel-layout{height:calc(100dvh - 54px);display:grid;grid-template-columns:minmax(250px,1fr) 220px}.board-wrap{position:relative;padding:10px 16px}.board{height:100%;display:grid;grid-template-rows:28px 1fr 28px 1fr 28px;gap:5px}.side-label{text-align:center;font-size:11px;letter-spacing:3px;color:#b9edf4}.field-row{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.zone{min-width:0;border:1px solid rgba(205,244,248,.38);background:rgba(11,42,55,.68);box-shadow:inset 0 0 18px rgba(82,187,207,.12);position:relative;display:flex;align-items:center;justify-content:center}.zone.trap{border-style:dashed}.zone.fusion{grid-column:3/5}.zone .tag{font-size:9px;color:#81c9d4;position:absolute}.zone.selected{outline:3px solid #ffd56a}.card{width:86%;max-width:92px;aspect-ratio:5/7;border:3px solid #d3b87a;background:linear-gradient(135deg,#7e522e 0 12%,#d5b36d 12% 18%,#f2dfab 18% 73%,#a87943 73%);color:#1d2430;box-shadow:3px 4px 0 rgba(0,0,0,.55);padding:5px;position:relative;text-align:center;transition:.25s transform,.25s filter}.card:hover{transform:translateY(-6px);filter:brightness(1.08)}.card-title{font-weight:bold;font-size:clamp(7px,.8vw,11px);height:22%;line-height:1}.card-art{height:48%;border:1px solid #9a763d;background:linear-gradient(145deg,#9bdcde,#4c8190);display:grid;place-items:center;font-size:20px}.card-stats{font-size:clamp(7px,.75vw,10px);font-weight:bold;position:absolute;bottom:3px;left:4px;right:4px}.monster{background:linear-gradient(135deg,#d9a35c 0 12%,#f3c96f 12% 18%,#fff0bd 18% 73%,#bc7a3e 73%)}
.hand{position:absolute;left:14%;right:14%;bottom:-48px;height:110px;display:flex;justify-content:center;gap:8px}.hand .card{width:76px;flex:0 0 76px}.board-wrap:hover .hand{bottom:3px}.sidebar{background:rgba(8,25,34,.93);border-left:1px solid #79bac7;padding:12px;display:flex;flex-direction:column;min-height:0}.lp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lpbox{border:1px solid #568997;padding:8px;background:#102b38}.lpbox span{display:block;font-size:9px;color:#89c1ca}.lpbox b{font-size:20px}.chat{flex:1;min-height:0;margin:12px 0;border:1px solid #4e8290;padding:7px;overflow:auto;background:#091c25;font-size:12px}.chat div{padding:4px 0;border-bottom:1px solid rgba(100,160,170,.12)}.chat-input{display:flex}.chat-input input{width:100%;min-width:0;padding:9px;border:1px solid #5c96a3;background:#06171f;color:white}.chat-input button{border:0;background:#71c2d1;color:#102530;padding:0 10px}.phase{text-align:center;font-weight:bold;color:#ffd56a;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.controls button{border:1px solid #76aeba;background:#173945;color:white;padding:9px 4px}.controls button:first-child{grid-column:1/3;background:#b88751}
.toast{position:absolute;z-index:20;left:50%;top:68px;transform:translateX(-50%);background:#102d39;border:1px solid #ffd56a;color:white;padding:10px 18px;font-weight:bold;box-shadow:5px 5px 0 rgba(0,0,0,.35)}
@media(max-width:780px){.duel-layout{grid-template-columns:1fr 150px}.board-wrap{padding:6px}.sidebar{padding:7px}.field-row{gap:3px}.card{width:94%;padding:3px}.card-art{font-size:14px}.hand{left:8%;right:8%;overflow:hidden}.hand .card{width:58px;flex-basis:58px}.lpbox b{font-size:14px}.topbar{height:48px}.duel-layout{height:calc(100dvh - 48px)}}
</style></head>
<body><div id="app">
<section id="menu" class="screen menu"><div class="panel"><h1 class="logo">DUEL<em>LINKS</em></h1><div class="sub">DIGITAL SKY ARENA</div><div class="form"><label>プレイヤー名</label><input id="playerName" value="PLAYER" maxlength="16"><label>ルーム名</label><input id="roomName" value="SKY-ROOM" maxlength="24"></div><div class="actions"><button id="onlineBtn" class="secondary">ONLINE</button><button id="offlineBtn">DUEL START</button></div></div></section>
<section id="rooms" class="screen menu hidden"><div class="panel"><h2>ROOM LIST</h2><div id="roomList"></div><button id="backMenu" class="wide">戻る</button></div></section>
<section id="duel" class="screen hidden"><header class="topbar"><div class="brand">DUEL<b>LINKS</b></div><div class="topactions"><button id="exitBtn">EXIT</button></div></header><main class="duel-layout"><div class="board-wrap"><div class="board"><div class="side-label">相手フィールド</div><div class="field-row" id="enemyRow"><div class="zone trap"><span class="tag">罠ゾーン</span></div><div class="zone trap"><span class="tag">罠ゾーン</span></div><div class="zone fusion"><span class="tag">融合ゾーン</span></div><div class="zone trap"><span class="tag">罠ゾーン</span></div><div class="zone trap"><span class="tag">罠ゾーン</span></div><div class="zone trap"><span class="tag">罠ゾーン</span></div></div><div class="side-label">MONSTER ZONE</div><div class="field-row" id="monsterRow"><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div></div><div class="side-label">自分フィールド</div></div><div class="hand" id="hand"></div></div><aside class="sidebar"><div class="lp"><div class="lpbox"><span id="pLabel">YOU</span><b id="myLP">8000</b></div><div class="lpbox"><span>CPU</span><b id="enemyLP">8000</b></div></div><div class="phase" id="phase">メインフェイズ</div><div class="chat" id="chat"><div>システム：デュエル準備完了</div></div><div class="chat-input"><input id="chatInput" placeholder="メッセージ"><button id="sendChat">送信</button></div><div class="controls"><button id="endBtn">ターン終了</button><button id="summonBtn">召喚</button><button id="skillBtn">効果</button></div></aside></main><div id="toast" class="toast hidden"></div></section>
</div>
<script>
const $=s=>document.querySelector(s);let myLP=8000,enemyLP=8000,turn=true,selected=null,atk=1950,controller=false;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(x.timer);x.timer=setTimeout(()=>x.classList.add('hidden'),1800)}
function card(name,atk,def,monster=true){return `<div class="card ${monster?'monster':''}" data-name="${name}" data-atk="${atk}" data-def="${def}"><div class="card-title">${name}</div><div class="card-art">⚔</div><div class="card-stats">ATK ${atk}<br>DEF ${def}</div></div>`}
function setupHand(){const h=$('#hand');h.innerHTML=card('ウルゥ･ｽﾗｼﾍ',1950,1100,true)+card('ビースト相闘剣士',2600,1000,true)+card('制御奪取',0,0,false);[...h.children].forEach(c=>c.onclick=()=>selectCard(c))}
function selectCard(c){document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selected=c;toast(c.dataset.name+' を選択')}
function summon(){if(!turn)return;if(!selected||!selected.classList.contains('monster')){toast('モンスターカードを選択');return}const z=[...$('#monsterRow').children].find(x=>!x.firstElementChild||!x.firstElementChild.classList.contains('card'));if(!z){toast('モンスターゾーンが満員');return}const clone=selected.cloneNode(true);clone.classList.remove('selected');clone.onclick=()=>activate(clone);z.appendChild(clone);selected.remove();selected=null;toast(clone.dataset.name+' を召喚');if(clone.dataset.name.includes('剣士'))enemyTurnSummon()}
function enemyTurnSummon(){toast('ビースト相闘剣士が特殊召喚！')}
function activate(c){if(c.dataset.name.includes('ウルゥ')){atk+=200;c.querySelector('.card-stats').innerHTML=`ATK ${atk}<br>DEF 1100`;toast('効果発動！ ATK +200 (二体のモンスターを破壊せず奪取)')}else toast(c.dataset.name+' の効果を確認')}
function endTurn(){if(!turn)return;turn=false;$('#phase').textContent='相手ターン';toast('相手ターン');setTimeout(()=>{const damage=Math.floor(Math.random()*700)+250;myLP-=damage;$('#myLP').textContent=myLP;turn=true;$('#phase').textContent='メインフェイズ';toast('相手の攻撃 '+damage+' ダメージ');if(myLP<=0){toast('敗北');myLP=8000;$('#myLP').textContent=myLP}},1400)}
$('#offlineBtn').onclick=()=>{startDuel()};$('#onlineBtn').onclick=()=>show('#rooms');
function startDuel(){show('#duel');$('#pLabel').textContent=$('#playerName').value||'YOU';setupHand();myLP=8000;enemyLP=8000;atk=1950;$('#myLP').textContent=myLP;$('#enemyLP').textContent=enemyLP;turn=Math.random()<.5;$('#phase').textContent=turn?'メインフェイズ':'相手ターン';toast(turn?'先攻です':'後攻です')}
$('#backMenu').onclick=()=>show('#menu');$('#roomList').innerHTML=['SKY-ROOM','DUEL ARENA','MASTER ROOM'].map((r,i)=>`<div class="room"><div>${r}<br><small>${i+1} / 2 プレイヤー</small></div><button onclick="joinRoom('${r}')">参加</button></div>`).join('');
window.joinRoom=r=>{$('#roomName').value=r;startDuel()};$('#exitBtn').onclick=()=>show('#menu');$('#summonBtn').onclick=summon;$('#skillBtn').onclick=()=>selected?activate(selected):toast('カードを選択');$('#endBtn').onclick=endTurn;
$('#sendChat').onclick=()=>{let i=$('#chatInput'),v=i.value.trim();if(!v)return;let d=document.createElement('div');d.textContent=($('#playerName').value||'YOU')+'：'+v;$('#chat').appendChild(d);i.value='';$('#chat').scrollTop=$('#chat').scrollHeight};$('#chatInput').onkeydown=e=>{if(e.key==='Enter')$('#sendChat').click()};
</script></body></html>
