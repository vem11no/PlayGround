<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DUEL SKY // ビースト相闘剣士</title>
<style>
:root{--blue:#00baf2;--cyan:#82efff;--ink:#071120;--gold:#d4a85b;--panel:rgba(7,18,39,.94);--line:rgba(130,239,255,.38)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Yu Gothic",sans-serif;background:#091425;color:#f4fbff}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,rgba(42,174,224,.22),transparent 26%),linear-gradient(135deg,#142c46,#09111f 58%,#08182a);z-index:-2}
body:after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(100,210,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(100,210,255,.025) 1px,transparent 1px);background-size:32px 32px;z-index:-1}
#app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 54px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(5,16,31,.95),rgba(16,55,82,.78));letter-spacing:.12em}.brand{font-size:13px;color:var(--cyan);font-weight:800}.brand b{color:#fff;font-size:18px}.roommeta{font-size:11px;text-align:right}.roommeta span{color:#8fb3cb}
#phaseBar{display:flex;align-items:center;gap:6px}.phase{font-size:10px;padding:7px 9px;border:1px solid rgba(130,239,255,.18);color:#7197a9}.phase.active{background:var(--blue);color:#03131b;border-color:#c8f8ff;box-shadow:0 0 16px rgba(0,186,242,.55)}
.duel{min-height:0;display:grid;grid-template-columns:178px minmax(520px,1fr) 178px}.side{padding:10px 12px;border-right:1px solid rgba(130,239,255,.12);background:rgba(3,12,25,.68)}.side.right{border-right:0;border-left:1px solid rgba(130,239,255,.12)}.playerhead{height:54px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.avatar{width:38px;height:38px;border:1px solid #76cff0;border-radius:50%;background:linear-gradient(145deg,#497c9f,#17243a);display:grid;place-items:center;font-weight:900}.lp{font-size:20px;font-weight:900;color:#fff}.lp small{display:block;text-align:right;font-size8px;color:#70b9d4}.deckstack{margin-top:12px;height:55px;border:1px solid rgba(130,239,255,.18);background:rgba(0,0,0,.18);display:grid;place-items:center;font-size:10px;color:#8bc5d7}.main{min-height:0;display:grid;grid-template-rows:minmax(205px,1fr) 118px;position:relative}.board{display:grid;grid-template-columns:repeat(4,minmax(58px,96px));grid-template-rows:repeat(2,minmax(92px,1fr));gap:8px;align-content:center;justify-content:center;padding:12px 16px}.zone{position:relative;border:1px solid rgba(130,239,255,.28);border-radius:2px;background:linear-gradient(135deg,rgba(37,97,130,.12),rgba(6,26,43,.44));box-shadow:inset 0 0 22px rgba(0,163,214,.04);display:grid;place-items:center;color:rgba(164,224,242,.32);font-size:9px}.zone.opponent{transform:none}.zone.fuse{grid-column:4;grid-row:1}.zone.trap{grid-column:span 1}.zone.trap span{writing-mode:horizontal-tb}.zone.enemy{grid-row:1}.zone.enemy:nth-of-type(n+5){grid-row:2}.board.enemyBoard{padding-bottom:4px}.board.playerBoard{padding-top:4px}.fieldhalf{display:grid;grid-template-rows:minmax(118px,1fr) 118px}.card3d{width:82%;height:88%;max-width:96px;max-height:130px;border:2px solid #bde7c9;border-radius:5px;background:#d9d1bd;color:#181b20;box-shadow:0 5px 15px rgba(0,0,0,.55);overflow:hidden;position:relative;cursor:pointer;transition:.18s}.card3d:hover{transform:translateY(-5px);filter:brightness(1.12)}.card3d .title{height:18px;padding:2px 4px;background:#aebf81;font-size:8px;font-weight:900;border-bottom:1px solid #55605a}.card3d .art{height:54%;margin:4px;background:radial-gradient(circle at 60% 40%,#9ddaff 0 6%,#254f72 7% 14%,#d5b36a 15% 18%,#283a46 19% 27%,transparent 28%),linear-gradient(145deg,#6e8791,#18273c);border:1px solid #68747e}.card3d .effect{font-size:6.5px;line-height:1.15;padding:2px 4px}.card3d .stats{position:absolute;right:3px;bottom:2px;font-size:8px;font-weight:900}.card3d.blue{border-color:#91eaff;background:#bdc8c8}.card3d.blue .title{background:#8dbbd2}.card3d.purple{border-color:#dcbdff;background:#bda8c7}.card3d.purple .title{background:#9e79ba}
.hand{height:118px;display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:5px 12px 0;border-top:1px solid rgba(130,239,255,.14);background:linear-gradient(transparent,rgba(0,20,35,.74))}.hand .card3d{height:108px;width:76px}.hand .card3d:hover{height:118px}.bottom{display:flex;align-items:center;justify-content:space-between;padding:7px 18px;border-top:1px solid var(--line);background:rgba(4,12,24,.96)}.log{font-size:11px;color:#8fb3cb}.log b{color:#fff}.btn{border:1px solid #7bd8ef;background:rgba(17,91,116,.55);color:#dffaff;padding:9px 14px;min-width:92px;font-size:11px;font-weight:900;letter-spacing:.08em;cursor:pointer}.btn:hover{background:#21b4d7;color:#04131a}.btn.danger{border-color:#c99b67}.phaseTag{font-size:10px;color:#9fd6e6}
#modal{display:none;position:fixed;inset:0;background:rgba(1,7,15,.84);z-index:20;align-items:center;justify-content:center}.panel{width:min(680px,calc(100vw - 30px));max-height:calc(100vh - 30px);overflow:auto;border:1px solid #65cee8;background:linear-gradient(145deg,#101e31,#07101d);padding:18px;box-shadow:0 0 60px rgba(38,181,220,.25)}.panel h2{margin:0 0 14px;color:#9eeeff;font-size:16px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel label{font-size:11px;color:#9bc5d4}.panel input{width:100%;margin-top:6px;border:1px solid #315a70;background:#081522;color:#fff;padding:11px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.cardbig{display:flex;gap:14px}.cardbig .card3d{flex:0 0 160px;height:220px;width:160px}.cardbig .card3d .title{height:28px;font-size:13px}.cardbig .card3d .art{height:120px}.cardbig .card3d .effect{font-size:10px}.cardbig .card3d .stats{font-size:13px}.cardtext{font-size:12px;line-height:1.7;color:#b8d6e2}.cardtext h3{color:#fff;margin:0 0 8px}.tag{display:inline-block;border:1px solid #39708c;color:#83cbdf;padding:3px 6px;margin:2px;font-size9px}
@media(max-width:760px){.duel{grid-template-columns:74px minmax(320px,1fr) 74px}.side{padding:6px}.playerhead{height:44px}.avatar{width:29px;height:29px}.lp{font-size:14px}.topbar{padding:0 8px}.roommeta{display:none}.phase{display:none}.phase.active{display:block}.deckstack{height:40px}.board{grid-template-columns:repeat(4,minmax(48px,72px));gap:3px;padding:5px}.main{grid-template-rows:minmax(190px,1fr) 105px}.hand{height:105px;gap:3px}.hand .card3d{height:94px;width:58px}.card3d{max-width:70px}.bottom{padding:6px}.log{max-width:45%;font-size:9px}.btn{min-width:75px;padding8px}.card3d .effect{display:none}.formrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><header class="topbar"><div class="brand"><b>DUEL SKY</b> / MASTER DUEL OS</div><div id="phaseBar"><div class="phase" data-p="DRAW">DRAW</div><div class="phase" data-p="MAIN">MAIN</div><div class="phase" data-p="BATTLE">BATTLE</div><div class="phase" data-p="END">END</div></div><div class="roommeta">ROOM <span id="roomName">NEO-01</span><br><span id="playerName">DUELIST</span></div></header>
<div class="duel"><aside class="side"><div class="playerhead"><div><div class="avatar" id="avatarA">A</div></div><div class="lp"><small>LP</small><span id="lpA">8000</span></div></div><div class="deckstack"><span id="deckA">DECK 35</span></div></aside>
<main class="main"><div class="fieldhalf"><div class="board enemyBoard" id="enemyBoard"></div><div class="board playerBoard" id="playerBoard"></div></div><div class="hand" id="hand"></div></main>
<aside class="side right"><div class="playerhead"><div><div class="avatar" id="avatarB">B</div></div><div class="lp"><small>LP</small><span id="lpB">8000</span></div></div><div class="deckstack"><span id="deckB">DECK 35</span></div></aside></div>
<footer class="bottom"><div class="log" id="log"><b>システム</b>：デュエル準備完了</div><div class="phaseTag" id="phaseText">MAIN PHASE</div><div><button class="btn" id="battleBtn">バトルフェイズ</button><button class="btn danger" id="endBtn">ターン終了</button></div></footer></div>
<div id="modal"><div class="panel" id="panel"></div></div>
<script>
const names=['ビースト相闘剣士','Ujｽﾗｼﾍｱﾝｽｱｲlacwin11'];
const cards=[
{name:names[0],atk:2600,def:1000,type:'融合モンスター',effect:'このカードは自分・相手モンスターが召喚されたら確認で特殊召喚できる',kind:'purple'},
{name:names[1],atk:1950,def:1100,type:'効果モンスター',effect:'このカードによる戦闘での二体は破壊されない。そのモンスターのコントロールを自分に移す。この効果を発動する度にこのカードの攻撃力を二百上げる',kind:'blue'},
{name:'スカイ・マジック・フレーム',atk:0,def:0,type:'罠カード',effect:'選択したモンスターゾーンのモンスターを破壊せず除外する',kind:'purple'},
{name:'デジタル・チャージ',atk:0,def:0,type:'魔法カード',effect:'自分のデッキからモンスターカードを１枚手札に加える',kind:'blue'},
{name:'スターダストウォリアー',atk:2400,def:1800,type:'効果モンスター',effect:'自分ターンのバトルフェイズ開始時に攻撃力が３００アップする',kind:'blue'}
];
let hand=[],ownBoard=[null,null,null,null],enemyBoard=[null,null,null,null],lp=[8000,8000],turn=0,phase='MAIN',deck=35,enemyDeck=35,stealAtk=1950;
for(let i=0;i<5;i++) hand.push({...cards[(i+1)%cards.length],uid:Math.random()});
const enemyCard={...cards[4],uid:1,atk:2400,def:1800};
enemyBoard[1]=enemyCard;
function cardHTML(c,big=false){return `<div class="card3d ${c.kind||'blue'}"><div class="title">${c.name}</div><div class="art"></div><div class="effect">${c.effect||''}</div><div class="stats">${c.atk||'?'}/${c.def||'?'}</div></div>`}
function render(){
 document.getElementById('lpA').textContent=lp[0];document.getElementById('lpB').textContent=lp[1];document.getElementById('deckA').textContent=`DECK ${deck}`;document.getElementById('deckB').textContent=`DECK ${enemyDeck}`;
 const eb=document.getElementById('enemyBoard');eb.innerHTML='';for(let i=0;i<6;i++){let z=document.createElement('div');z.className='zone enemy';if(i===4)z.className='zone fuse';z.textContent=i<4?'MONSTER':'EXTRA';if(i<4&&enemyBoard[i]){z.innerHTML=cardHTML(enemyBoard[i]);}eb.appendChild(z)}
 const pb=document.getElementById('playerBoard');pb.innerHTML='';for(let i=0;i<6;i++){let z=document.createElement('div');z.className='zone';if(i===4)z.className='zone fuse';z.textContent=i<4?'MONSTER':'TRAP / SPELL';if(i<4&&ownBoard[i]){z.innerHTML=cardHTML(ownBoard[i]);z.onclick=()=>inspect(ownBoard[i])}pb.appendChild(z)}
 const h=document.getElementById('hand');h.innerHTML='';hand.forEach((c,i)=>{let d=document.createElement('div');d.innerHTML=cardHTML(c);d.onclick=()=>playCard(i);h.appendChild(d)});
 document.queryState='';document.querySelectorAll('.phase').forEach(e=>e.classList.toggle('active',e.dataset.p===phase));document.getElementById('phaseText').textContent=phase+' PHASE';
}
function log(s){document.getElementById('log').innerHTML=`<b>システム</b>：${s}`}
function playCard(i){if(phase==='END'||phase==='BATTLE'){log('このフェイズでは召喚できません');return}const c=hand[i];let slot=ownBoard.findIndex(x=>!x);if(slot<0){log('モンスターゾーンが満杯です');return}ownBoard[slot]={...c,uid:Math.random(),atk:c.name===names[1]?stealAtk:c.atk};hand.splice(i,1);deck=Math.max(0,deck-1);log(`${c.name} をフィールドに出しました`);render();inspect(ownBoard[slot],true)}
function inspect(c,played=false){if(!c)return;const m=document.getElementById('modal'),p=document.getElementById('panel');m.style.display='flex';p.innerHTML=`<h2>カード詳細</h2><div class="cardbig">${cardHTML(c,true)}<div class="cardtext"><h3>${c.name}</h3><span class="tag">${c.type}</span><br><br>${c.effect}<hr><b>ATK ${c.atk} / DEF ${c.def}</b></div></div><div class="actions"><button class="btn" id="closeModal">閉じる</button>${c.name===names[1]?'<button class="btn" id="stealBtn">戦闘効果発動</button>':''}</div>`;document.getElementById('closeModal').onclick=()=>m.style.display='none';if(document.getElementById('stealBtn'))document.getElementById('stealBtn').onclick=()=>{stealAtk+=200;c.atk=stealAtk;log(`効果発動！「${names[1]}」の攻撃力が２００アップ（現在${stealAtk}）`);let ei=enemyBoard.findIndex(x=>x);if(ei>=0){enemyBoard[ei]=null;log('相手モンスターを破壊せずコントロールを奪いました');}m.style.display='none';render()}}
window.addEventListener('click',e=>{if(e.target.id==='modal')e.target.style.display='none'});
document.getElementById('battleBtn').onclick=()=>{if(phase==='BATTLE'){log('すでにバトルフェイズです');return}phase='BATTLE';let ei=enemyBoard.findIndex(x=>x),oi=ownBoard.findIndex(x=>x);if(ei>=0&&oi>=0){let a=ownBoard[oi],b=enemyBoard[ei];if(a.atk>b.atk){enemyBoard[ei]=null;lp[1]-=Math.max(0,a.atk-b.atk);log(`${a.name}で勝利！ 相手LPにダメージ`)}else if(a.atk<b.atk){ownBoard[oi]=null;lp[0]-=Math.max(0,b.atk-a.atk);log(`${b.name}で反撃！ 自分LPにダメージ`)}else log('戦闘は引き分けです')}else log('バトルフェイズ開始');render();if(lp[0]<=0||lp[1]<=0)endGame()};
document.getElementById('endBtn').onclick=()=>{turn++;phase='MAIN';let drawn={...cards[(turn+3)%cards.length],uid:Math.random()};hand.push(drawn);deck=Math.max(0,deck-1);enemyDeck=Math.max(0,enemyDeck-1);lp[turn%2===0?0:1]+=0;log(`ターン終了。相手ターン → 「${drawn.name}」をドロー`);render()};
function endGame(){setTimeout(()=>{const won=lp[1]<=0;document.getElementBy('#');document.getElementById('panel').innerHTML=`<h2>${won?'WIN':'LOSE'}</h2><p>${won?'デュエルに勝利しました':'デュエルに敗北しました'}</p><div class="actions"><button class="btn" onclick="location.reload()">もう一度</button></div>`;document.getElementById('modal').style.display='flex'},250)}
function setup(){const room=prompt('ルーム名を入力してください','NEO-01')||'NEO-01';const player=prompt('プレーヤー名を入力してください','DUELIST')||'DUELIST';document.getElementById('roomName').textContent=room.slice(0,16);document.getElementById('playerName').textContent=player.slice(0,16);document.getElementById('avatarA').textContent=player[0].toUpper||'A';render()}
setup();
</script>
</body>
</html>
