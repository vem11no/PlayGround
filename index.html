<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUEL NEXUS</title>
<style>
:root{--sky:#bfe7f1;--ink:#25211b;--gold:#d8b878;--brown:#7d5b43;--panel:#eee2ca}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#9bcad7}
button,input{font:inherit}.app{height:100%;background:linear-gradient(145deg,#c9edf4,#8eb9c5);display:grid;grid-template-columns:68px 1fr 220px;position:relative}
.rail{background:#33291f;color:#f3dfbb;border-right:3px solid #b99558;display:flex;flex-direction:column;align-items:center;padding:10px 5px;gap:12px}.brand{font-size:12px;font-weight:900;writing-mode:vertical-rl;letter-spacing:3px;color:#92def2}.railbtn{width:48px;height:48px;border:1px solid #a88a5a;background:#51412f;color:#e8d19d;cursor:pointer}.railbtn b{display:block;font-size:17px}.railbtn span{font-size:8px}.railbtn.on{background:#87cfdf;color:#183239}
.board{min-width:0;height:100%;display:grid;grid-template-rows:48px 1fr 42px;padding:6px 10px}.topbar{display:flex;align-items:center;justify-content:space-between}.identity{height:38px;background:rgba(238,226,202,.88);border:2px solid #7d6548;border-radius:4px;display:flex;align-items:center;gap:8px;padding:4px 10px}.avatar{width:28px;height:28px;border-radius:50%;background:#68b3c7;border:2px solid #d8c28e}.name{font-weight:900;font-size:13px}.lp{font-size:18px;font-weight:900;color:#7b4a28}.turnbox{text-align:center}.turnbox strong{display:block;font-size:13px}.phase{font-size:9px;color:#5e5548}.room{font-size:11px;border:1px solid #80684e;padding:5px 9px;background:#eee1c5}
.duel{position:relative;display:grid;grid-template-rows:1fr 1fr;min-height:0}.side{position:relative;display:grid;grid-template-columns:92px 1fr 92px;align-items:center}.zones{display:grid;grid-template-columns:repeat(5,minmax(44px,78px));gap:5px;justify-content:center}.extraRow{display:flex;justify-content:flex-end;gap:5px}.zone{aspect-ratio:.72;border:2px solid rgba(87,73,52,.8);background:rgba(232,218,184,.42);box-shadow:inset 0 0 12px rgba(75,122,137,.3);position:relative;display:flex;align-items:center;justify-content:center}.zone.trap{border-color:#9b8c6b}.zone .mini{width:88%;height:88%;font-size:9px;text-align:center;padding:3px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#efdfaa,#d4a95c);border:2px solid #fff7cf}.zone .mini.blue{background:linear-gradient(135deg,#98d5e5,#4e96a9);color:#102b31}.zone .mini.dark{background:linear-gradient(135deg,#9d8069,#513b2e);color:#fff0c7}.zone .atk{font-size:11px;font-weight:900}.hand{display:flex;gap:-8px;justify-content:center}.handcard{width:58px;height:82px;margin:0 -5px;border:2px solid #6b5a43;background:#efdda9;padding:3px;font-size:8px;text-align:center;border-radius:3px;cursor:pointer;transition:.15s}.handcard:hover{transform:translateY(-8px)}.handcard.selected{outline:3px solid #5bc1d9}.opp .handcard{background:#c0dce2}.grave{writing-mode:vertical-rl;font-size:8px;color:#78674f;text-align:right}.battleline{position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(93,76,52,.35)}
.sidebar{background:rgba(239,224,193,.94);border-left:3px solid #80684e;padding:8px;display:flex;flex-direction:column;gap:7px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tabs button{border:1px solid #867255;background:#dbcbac;font-size:9px;height:28px}.tabs button.on{background:#74bcca}.log{flex:1;background:#f7efda;border:1px solid #927c5b;padding:7px;font-size:10px;overflow:auto}.log p{margin:3px 0;border-bottom:1px dotted #b9aa8b;padding-bottom:3px}.commands{display:grid;grid-template-columns:1fr 1fr;gap:5px}.commands button{height:44px;border:2px solid #806b50;background:#d8bd82;font-weight:900;font-size:11px;cursor:pointer}.commands button.primary{background:#72c1d0}.footer{display:flex;align-items:center;justify-content:center}.chatline{width:min(600px,70%);height:30px;border:1px solid #80684e;background:rgba(247,239,218,.9);padding:5px 8px;font-size:11px}
.modal{position:absolute;inset:0;background:rgba(38,38,35,.55);z-index:10;display:flex;align-items:center;justify-content:center}.modal.off{display:none}.dialog{width:min(520px,88%);background:#eee1c5;border:4px solid #765f45;padding:16px;box-shadow:8px 8px 0 rgba(40,36,29,.35)}.dialog h2{margin:0 0 12px}.row{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0}.dialog input{border:2px solid #877557;background:#fff9e9;padding:8px}.dialog button{border:2px solid #80684e;background:#82bec9;height:36px;padding:0 14px;margin-right:6px}.dialog .start{background:#d5b878}.roomlist{max-height:110px;overflow:auto;border:1px solid #a58d69;background:#f8efd9;margin:8px 0}.roomitem{height:34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px dotted #baa98b;padding:3px 6px;font-size:12px}.roomitem button{height:26px;padding:0 10px}.toast{position:absolute;z-index:20;left:50%;top:18%;transform:translateX(-50%);background:#29261f;color:#fff4ca;padding:8px 14px;border:2px solid #d6b872;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.app{grid-template-columns:48px 1fr}.sidebar{position:absolute;right:0;top:48px;bottom:42px;width:170px;z-index:5}.side{grid-template-columns:44px 1fr 44px}.zones{grid-template-columns:repeat(5,minmax(38px,54px));gap:3px}.board{padding:3px}.identity:nth-child(3){display:none}.handcard{width:46px;height:66px}.room{display:none}.zone{min-height:52px}}
</style></head>
<body><div class="app">
<nav class="rail"><div class="brand">DUELINKS</div><button class="railbtn on"><b>⚔</b><span>DUEL</span></button><button class="railbtn" id="lobbyBtn"><b>⌂</b><span>ROOM</span></button><button class="railbtn"><b>▤</b><span>DECK</span></button></nav>
<main class="board"><header class="topbar"><div class="identity"><div class="avatar"></div><div><div class="name" id="pName">PLAYER</div><div class="lp" id="pLp">8000 LP</div></div></div><div class="turnbox"><strong id="turnText">TURN 1 — PLAYER</strong><div class="phase" id="phaseText">MAIN PHASE 1</div></div><div class="identity"><div><div class="name">RIVAL</div><div class="lp" id="eLp">8000 LP</div></div><div class="avatar"></div></div><div class="room" id="roomName">ROOM / SOLO</div></header>
<section class="duel"><div class="battleline"></div><div class="side opp"><div class="grave">除外 0<br>墓地 0</div><div><div class="extraRow"><div class="zone trap"></div><div class="zone trap"></div></div><div class="zones" id="enemyZones"><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div><div class="zone"></div></div></div><div class="hand"><div class="handcard">?</div><div class="handcard">?</div></div></div>
<div class="side own"><div class="grave">除外 0<br>墓地 0</div><div><div class="zones" id="ownZones"><div class="zone" data-i="0"></div><div class="zone" data-i="1"></div><div class="zone" data-i="2"></div><div class="zone" data-i="3"></div><div class="zone" data-i="4"></div></div><div class="extraRow"><div class="zone trap"></div><div class="zone trap"></div></div></div><div class="hand" id="hand"><div class="handcard" data-card="lac">Ujｽﾗｼﾍｱﾝｽｱｲlacwin11<br><b>1950</b></div><div class="handcard" data-card="beast">ビースト相闘剣士<br><b>2600</b></div><div class="handcard">銀河戦士<br><b>1800</b></div></div></div></section>
<footer class="footer"><input class="chatline" id="chat" placeholder="チャットを送信..."></footer></main>
<aside class="sidebar"><div class="tabs"><button class="on">ログ</button><button>デッキ</button><button>設定</button></div><div class="log" id="log"><p>ターン1。先攻プレイヤー。</p><p>デッキをシャッフルしました。</p></div><div class="commands"><button id="summonBtn">召喚</button><button id="attackBtn" class="primary">戦闘</button><button id="effectBtn">効果</button><button id="endBtn">ターン終了</button></div></aside>
<div class="modal" id="modal"><div class="dialog"><h2>ONLINE DUEL ROOM</h2><div class="row"><label>プレイヤー名</label><input id="nameIn" value="PLAYER"></div><div class="row"><label>ルーム名</label><input id="roomIn" value="MASTER DUEL"></div><div class="roomlist" id="roomList"></div><button class="start" id="onlineBtn">ルーム作成</button></div></div><div class="toast" id="toast"></div>
</div>
<script>
let turn=1,phase='MAIN PHASE 1',lp=[8000,8000],selected=null,bonus=1950,enemyTurn=false;
const $=s=>document.querySelector(s),log=$('#log');
function addLog(t){let p=document.createElement('p');p.textContent=t;log.prepend(p)}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),900)}
function render(){ $('#pLp').textContent=lp[0]+' LP';$('#eLp').textContent=lp[1]+' LP';$('#turnText').textContent='TURN '+turn+' — '+(enemyTurn?'RIVAL':'PLAYER');$('#phaseText').textContent=phase }
$('#lobbyBtn').onclick=()=>$('#modal').classList.remove('off');
$('#onlineBtn').onclick=()=>start(true);
$('#roomList').onclick=e=>{let b=e.target.closest('[data-room]');if(!b)return;$('#roomIn').value=b.dataset.room;start(true)};
function start(online){ $('#pName').textContent=$('#nameIn').value||'PLAYER';$('#roomName').textContent='ROOM / '+$('#roomIn').value||'SOLO';$('#modal').classList.add('off');addLog(online?'オンラインルームを作成しました。':'オフラインデュエルを開始。');toast('DUEL START') }
$('#chat').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){addLog($('#pName').textContent+': '+e.target.value);e.target.value=''}};
function summonCard(card){if(enemyTurn)return;let empty=[...document.querySelectorAll('#ownZones .zone')].find(z=>!z.firstChild);if(!empty)return toast('モンスターゾーンが満杯');empty.innerHTML=`<div class="mini ${card==='lac'?'blue':'dark'}"><span>${card==='lac'?'Ujｽﾗｼﾍｱﾝｽｱｲlacwin11':'ビースト相闘剣士'}</span><b class="atk">ATK ${card==='lac'?bonus:2600}</b></div>`;if(card==='lac')selected=empty;addLog((card==='lac'?'Ujｽﾗｼﾍｱﾝｽｱｲlacwin11':'ビースト相闘剣士')+'を召喚しました。');toast('召喚成功')}
$('#hand').onclick=e=>{let c=e.target.closest('.handcard');if(!c)return;document.querySelectorAll('.handcard').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selected=c.dataset.card};
$('#summonBtn').onclick=()=>{if(!selected)return toast('手札からカードを選択');summonCard(selected);let h=[...document.querySelectorAll('.handcard')].find(x=>x.dataset.card===selected);if(h)h.remove();selected=null};
$('#effectBtn').onclick=()=>{let lac=[...document.querySelectorAll('#ownZones .mini')].find(x=>x.textText||x.textContent.includes('lacwin11'));bonus+=200;document.querySelectorAll('#ownZones .mini').forEach(x=>{if(x.textContent.includes('lacwin11'))x.querySelector('.atk').textContent='ATK '+bonus});addLog('効果発動：このカードは200アップ。');toast('効果発動 +200 ATK')};
$('#attackBtn').onclick=()=>{let attacker=[...document.querySelectorAll('#ownZones .mini')][0];if(!attacker)return toast('モンスターがありません');let atk=parseInt(attacker.querySelector('.atk').textContent.replace(/[^0-9]/g,''));lp[1]-=atk;if(lp[1]<0)lp[1]=0;render();addLog('直接攻撃：相手に'+atk+'ダメージ。');if(!lp[1]){toast('DUEL WIN');return}$('#enemyZones').firstElementChild.innerHTML='<div class="mini dark"><b>相手モンスター</b></div>'};
$('#endBtn').onclick=()=>{if(enemyTurn)return;enemyTurn=true;phase='BATTLE PHASE';render();addLog('ターンをエンドしました。');setTimeout(()=>{lp[0]-=300;if(lp[0]<0)lp[0]=0;render();addLog('相手の効果：300ダメージ。');turn++;enemyTurn=false;phase='MAIN PHASE 1';render();toast('YOUR TURN')},1300)};
render();
</script></body></html>
