<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUELLINKS</title>
<style>
:root{--ink:#35271d;--blue:#85d0ff;--panel:#b9a184;--gold:#eacb82;--red:#bd5d42}*{box-sizing:border-box}body{margin:0;background:#17110e;color:var(--ink);font-family:"Yu Gothic",sans-serif;overflow:hidden}.app{height:100vh;min-height:600px;display:grid;grid-template-rows:48px 1fr 54px;background:linear-gradient(135deg,#c8dfe8,#83a9be 50%,#d7c8a7)}header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#4d4135;border-bottom:3px solid #d7c59c;color:#fff}header b{letter-spacing:3px}.mode{font-size:12px;color:#e8dcbd}.board{display:grid;grid-template-columns:210px 1fr 210px;gap:8px;padding:8px}.side{background:rgba(73,58,43,.76);border:2px solid #d1b887;border-radius:8px;color:white;padding:8px}.player{height:54px;background:#65513d;border:1px solid #dacb9e;border-radius:5px;padding:6px;margin-bottom:7px}.lp{float:right;color:#ffd76d;font-size:18px}.field{position:relative;display:grid;grid-template-columns:28px repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:5px;border:3px solid #b09a74;border-radius:10px;padding:7px;background:linear-gradient(145deg,rgba(206,222,218,.94),rgba(105,145,157,.94));box-shadow:inset 0 0 22px #e6eee8}.zone{position:relative;display:grid;place-items:center;border:1px solid rgba(76,61,45,.55);border-radius:3px;background:rgba(242,236,211,.28);min-height:42px}.zone.enemy{background:rgba(183,114,91,.22)}.zone.drop{outline:2px dashed #fff7b2}.rowlab{writing-mode:vertical-rl;text-align:center;font-size:10px;color:#4c4033}.card{width:68px;height:96px;border:3px solid #6c4d27;border-radius:5px;background:#e4d8a7;box-shadow:0 3px 7px #3a3127;position:relative;padding:3px;text-align:center;font-size:9px;user-select:none;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-5px)}.card.beast{background:linear-gradient(#f1e7b9 72%,#8c6b42 72%)}.card.magic{background:linear-gradient(#bfe7e4 72%,#4e8490 72%)}.card-name{height:16px;overflow:hidden;font-weight:bold}.art{height:48px;border:1px solid #92734a;background:repeating-linear-gradient(45deg,#d7b66d 0 6px,#9f8a55 6px 12px);display:grid;place-items:center;font-size:27px}.stats{position:absolute;right:3px;bottom:1px;font-size:8px;font-weight:bold}.card.selected{outline:3px solid #fff;filter:brightness(1.12)}.extra{position:absolute;right:-35px;top:38%;width:62px;height:42px;border:1px dashed #fff;color:white;text-align:center;font-size:9px}.hand{display:flex;gap:5px;align-items:center;justify-content:center}.hand .card{width:58px;height:82px}.hand .art{height:40px}.handwrap{display:flex;align-items:center}.deck{font-size:11px;margin:12px 0}.deck-list{height:90px;overflow:hidden}.mini{height:19px;margin:3px;border:1px solid #8b795e;background:#cbbf9e;font-size:9px;padding:3px}.grave{position:absolute;right:10px;bottom:12px;background:#503f32;color:white;padding:5px;border:1px solid #d1c3a4;border-radius:4px;font-size:10px}.banned{width:18px;height:18px;border-radius:50%;background:#b64b39;color:white;display:grid;place-items:center;font-size:11px;position:absolute;left:-8px;top:-8px}.bottom{grid-row:3;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#3d342c;color:#eee;border-top:2px solid #cbb68e}.chat{flex:1;background:#25201c;border:1px solid #837257;border-radius:5px;height:38px;padding:7px 10px;color:#fff}.bottom button,.overlay button{height:38px;border:1px solid #d3c091;border-radius:5px;background:#9d8463;color:#fff;font-weight:bold;cursor:pointer}.bottom button:hover{background:#c09a68}.overlay{position:absolute;z-index:20;inset:0;background:rgba(37,29,23,.72);display:grid;place-items:center}.panel{width:min(410px,92vw);background:#b7a181;border:3px solid #d8c69d;border-radius:9px;padding:18px;box-shadow:0 12px 35px #211a15}.panel h2{margin:0 0 12px;color:#463827}.panel input{width:100%;height:42px;margin:5px 0;padding:8px;border:2px solid #766651;border-radius:4px;background:#eee4ca}.choice{display:flex;gap:8px;margin-top:12px}.choice button{flex:1}.notice{position:absolute;z-index:15;top:55px;left:50%;transform:translateX(-50%);background:#f4e7b7;border:2px solid #80694a;border-radius:6px;padding:8px 14px;font-weight:bold;display:none}.hpbar{height:8px;background:#30251d;border-radius:5px;margin-top:5px}.hpbar i{display:block;height:100%;background:#8fc9b0;width:100%;border-radius:5px}.log{font-size:10px;height:120px;overflow:auto;margin-top:8px;border-top:1px solid #8a795f;padding-top:5px}@media(max-width:760px){.board{grid-template-columns:1fr}.side{display:none}.field{grid-template-columns:24px repeat(4,1fr)}.card{width:54px;height:80px}.card .art{height:36px}.hand .card{width:48px;height:70px}.hand .art{height:32px}.app{grid-template-rows:44px 1fr 48px}.extra{right:-22px}.bottom{padding:5px}.bottom button{padding:0 7px;font-size:11px}}
</style></head>
<body>
<div class="app"><header><b>DUELLINKS</b><div class="mode" id="mode">オフライン / デュエル</div><div id="turnTop">ターン 1</div></header>
<div class="notice" id="notice"></div>
<div class="board">
<aside class="side"><div class="player"><span id="p1name">プレイヤー1</span><span class="lp" id="lp1">8000</span><div class="hpbar"><i id="hp1"></i></div></div><div class="deck"><b>メインデッキ</b><span id="deckcount"> 20</span><div class="deck-list" id="decklist"></div></div></aside>
<main class="field" id="field"></main>
<aside class="side"><div class="player"><span id="p2name">相手</span><span class="lp" id="lp2">8000</span><div class="hpbar"><i id="hp2"></i></div></div><div class="deck"><b>相手デッキ</b><span> 20</span></div><div class="grave" id="grave">墓地: 0</div><div class="log" id="log"></div></aside>
</div>
<div class="bottom"><div class="chat" id="chat">ルームチャット：準備完了</div><button id="summon">召喚</button><button id="draw">ドロー</button><button id="phase">ターン終了</button></div>
</div>
<div class="overlay" id="overlay"><div class="panel"><h2>DUELLINKS</h2><input id="name" placeholder="プレイヤー名"><input id="room" placeholder="ルーム名"><div class="choice"><button id="offline">オフライン</button><button id="online">オンラインルーム</button></div></div></div>
<script>
const $=s=>document.querySelector(s),field=$('#field'),logEl=$('#log');let selected=null,lp=[8000,8000],turn=1,current=0,deckCount=20,chatMode='オフライン';
const cards=[
{name:'ビースト相闘剣士',type:'beast',atk:2600,def:1000,icon:'剣'},
{name:'lacwin11',type:'beast',atk:1950,def:1100,icon:'龍'},
{name:'青眼の銀剣士',type:'beast',atk:2100,def:1600,icon:'獅'},
{name:'魔力連鎖',type:'magic',atk:0,def:0,icon:'鎖'},
{name:'制圧の円陣',type:'magic',atk:0,def:0,icon:'陣'}];
let hand=[makeCard(1),makeCard(0),makeCard(2),makeCard(3)];
function makeCard(i){return {...cards[i],uid:Math.random().toString(36).slice(2)}}
function build(){field.innerHTML='';for(let r=0;r<5;r++){let lab=['','','','',''];field.innerHTML+='<div class="rowlab">'+(['相手魔罠','相手モンスター','融合ゾーン','自分モンスター','自分魔罠'][r])+'</div>';for(let c=0;c<4;c++){let kind=r===1?'enemy':r===3?'monster':r===0||r===4?'trap':'fusion';field.innerHTML+=`<div class="zone ${kind}" data-r="${r}" data-c="${c}" ${r===2&&c>0?'style="visibility:hidden"':''}></div>`}}let zones=field.querySelectorAll('.zone');zones[1].appendChild(cardEl(makeCard(2),true));zones[1].dataset.occupied='1';zones[2].appendChild(cardEl(makeCard(4),true));zones[2].dataset.occupied='1';zones[10].appendChild(cardEl(hand[1],false));zones[10].dataset.occupied='1';hand=hand.filter(c=>c!==hand[1]);renderHand()}
function cardEl(card,enemy){let d=document.createElement('div');d.className='card '+card.type+(enemy?' enemy-card':'');d.dataset.uid=card.uid;d.innerHTML=`<div class="banned">×</div><div class="card-name">${card.name}</div><div class="art">${card.icon}</div><div class="stats">${card.atk?`ATK ${card.atk} / DEF ${card.def}`:'MAGIC'}</div>`;d.onclick=e=>{e.stopPropagation();selectCard(d)};return d}
function renderHand(){let old=$('.handwrap');if(old)old.remove();let wrap=document.createElement('div');wrap.className='handwrap';wrap.style.gridColumn='2/6';wrap.style.gridRow='5';wrap.style.zIndex='5';let handDiv=document.createElement('div');handDiv.className='hand';hand.forEach(c=>handDiv.appendChild(cardEl(c,false)));wrap.appendChild(handDiv);field.appendChild(wrap)}
function selectCard(el){document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));selected=el;el.classList.add('selected')}
function notice(s){let n=$('#notice');n.textContent=s;n.style.display='block';clearTimeout(notice.t);notice.t=setTimeout(()=>n.style.display='none',1600)}
function log(s){let p=document.createElement('div');p.textContent=s;logEl.prepend(p)}
function setup(name,room,mode){$('#p1name').textContent=name||'プレイヤー1';$('#p2name').textContent='相手';$('#mode').textContent=mode+' / '+room;chatMode=mode;$('#overlay').remove();build();$('#chat').textContent=`${mode}：ルーム「${room||'名無し'}」に接続`;log('先攻・後攻をランダム決定');log(Math.random()<.5?'あなたの先攻です':'相手の先攻です')}
$('#offline').onclick=()=>setup($('#name').value,$('#room').value,'オフライン');$('#online').onclick=()=>setup($('#name').value,$('#room').value,'オンラインルーム');
field.addEventListener('click',e=>{if(!selected)return;let z=e.target.closest('.zone');if(!z)return;if(z.dataset.occupied)return;let r=+z.dataset.r;if(r===3||r===4){z.appendChild(selected);z.dataset.occupied='1';hand=hand.filter(c=>c.uid!==selected.dataset.uid);selected.classList.remove('selected');selected=null;renderHand();notice('フィールドへ移動');log('カードをフィールドに配置');}});
$('#summon').onclick=()=>{let z=[...field.querySelectorAll('.zone')].find(x=>x.dataset.r==='3'&&!x.dataset.occupied);if(selected){z?.appendChild(selected);if(z){z.dataset.occupied='1';hand=hand.filter(c=>c.uid!==selected.dataset.uid);selected.classList.remove('selected');selected=null;renderHand();notice('召喚成功');log('モンスターを召喚')}}else notice('召喚するカードを選択')};
$('#draw').onclick=()=>{if(deckCount<=0)return notice('デッキがありません');deckCount--;hand.push(makeCard(Math.floor(Math.random()*cards.length)));renderHand();$('#deckcount').textContent=' '+deckCount;notice('カードをドロー');log('デッキから手札へ')};
$('#phase').onclick=()=>{turn++;lp[1]=Math.max(0,lp[1]-100);$('#lp2').textContent=lp[1];$('#hp2').style.width=(lp[1]/80)+'%';$('#turnTop').textContent='ターン '+turn;notice('ターン終了：相手ターン');log('相手ターンへ移行');setTimeout(()=>{turn++;$('#turnTop').textContent='ターン '+turn;notice('あなたのターン');log('ターン '+turn+'：自分ターン')},1500)};
setTimeout(()=>document.querySelectorAll('.deck-list').forEach(d=>{for(let i=0;i<8;i++){let m=document.createElement('div');m.className='mini';m.text='';m.textContent=['ビースト相闘剣士','lacwin11','銀剣士','魔力連鎖'][i%4];d.appendChild(m)}}),0);
</script>
</body></html>
